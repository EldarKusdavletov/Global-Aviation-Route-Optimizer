[build]
buildCommand = "scripts/build.sh && pip install -r requirements.txt"

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 100
startCommand = "streamlit run src/python/main.py --server.port=$PORT --server.address=0.0.0.0 --server.headless=true --server.enableCORS=false --server.enableXsrfProtection=false"
restartPolicyType = "on_failure"
